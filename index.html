<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>실시간 통역</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d38;
    --fg:#e6edf3; --dim:#8b949e; --accent:#3fb950; --warn:#d29922; --err:#f85149;
    --live:#58a6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
         border-bottom:1px solid var(--line);padding:10px 12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input,button{font:inherit;background:#0d1117;color:var(--fg);
         border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input{flex:1;min-width:0}
  button{background:#21262d;font-weight:600}
  button:active{background:#30363d}
  #mic{flex:1;padding:16px;font-size:17px;border-radius:12px}
  #mic.on{background:var(--accent);color:#04160a;border-color:var(--accent)}
  #status{font-size:12px;color:var(--dim);margin-top:6px;min-height:16px}
  #status .live{color:var(--live)}
  #status .err{color:var(--err)}
  main{padding:12px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:10px 12px}
  .card.preview{border-style:dashed;opacity:.75}
  .src{color:var(--dim);font-size:14px}
  .dst{font-size:19px;margin-top:4px;font-weight:500}
  .dst.pending{color:var(--dim);font-style:italic}
  .dst.fail{color:var(--err)}
  .meta{font-size:11px;color:var(--dim);margin-top:6px;
        display:flex;gap:10px;justify-content:space-between}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;padding:4px 0}
  label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);padding:0 12px}
</style>
</head>
<body>

<header>
  <details>
    <summary>설정</summary>
    <div class="row" style="margin-top:8px">
      <input id="proxy" placeholder="Worker URL (https://xxx.workers.dev)">
    </div>
    <div class="row" style="margin-top:8px">
      <input id="apikey" placeholder="API Key (Worker에 심었으면 비워두기)" type="password">
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk"><input type="checkbox" id="tts" checked> 번역 음성 출력</label>
      <label class="chk"><input type="checkbox" id="duck" checked> 출력 중 마이크 차단</label>
      <label class="chk"><input type="checkbox" id="prev" checked> 실시간 미리보기</label>
    </div>
  </details>

  <div class="row" style="margin-top:8px">
    <select id="src">
      <option value="ko">한국어</option>
      <option value="en" selected>English</option>
      <option value="cs">Čeština</option>
    </select>
    <span>→</span>
    <select id="dst">
      <option value="ko" selected>한국어</option>
      <option value="en">English</option>
      <option value="cs">Čeština</option>
    </select>
    <select id="engine">
      <option value="deepl">DeepL</option>
      <option value="google">Google</option>
    </select>
    <button id="swap" title="언어 교환">⇄</button>
  </div>

  <div class="row" style="margin-top:8px">
    <button id="mic">● 통역 시작</button>
    <button id="clear">지우기</button>
  </div>
  <div id="status"></div>
</header>

<main id="log"></main>
<p class="hint">Galaxy 사용 시 <b>Chrome</b> 권장. 삼성 인터넷은 Web Speech API 동작이 불안정합니다. HTTPS 필수.</p>

<script>
/* =========================================================================
   실시간 스트리밍 통역 엔진
   설계 원칙:
     (1) onend는 "발화 종료"가 아니라 "Android 엔드포인터 타임아웃"이다.
         → onend에서 절대 번역을 확정(flush)하지 않는다. 즉시 재시작만 한다.
     (2) 문장 확정은 앱 레벨 타이머/문장부호/길이로만 판단한다.
     (3) final 텍스트는 event.resultIndex 이후의 델타만 취한다.
     (4) 세션이 재시작되면 세션 인덱스를 리셋한다 (중복 방지의 핵심).
   ========================================================================= */

const CFG = {
  SILENCE_FLUSH_MS : 900,   // 이 시간동안 새 결과 없으면 문장 확정
  HARD_FLUSH_CHARS : 180,   // 너무 길어지면 강제 확정
  PREVIEW_THROTTLE : 350,   // interim 번역 최소 간격
  PREVIEW_MIN_CHARS: 4,     // 이 길이 미만 interim은 번역 안 함
  RESTART_DELAY_MS : 120,   // 세션 재시작 지연 (0이면 InvalidStateError 빈발)
  WATCHDOG_MS      : 3000,  // 좀비 세션 감시 주기
  DEAD_AIR_MS      : 20000, // 살아있다는데 20초간 무이벤트 → 강제 재기동
  FETCH_TIMEOUT_MS : 8000,
  CACHE_MAX        : 400,
  CONTEXT_CHARS    : 220,   // DeepL context로 보낼 직전 원문 길이
};

/* ---------- 안전한 설정 저장 (localStorage 미지원 환경 대비) ---------- */
const store = (() => {
  const mem = {};
  return {
    get(k){ try{ return localStorage.getItem(k) ?? mem[k] ?? ''; }catch(e){ return mem[k] ?? ''; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
})();

const $ = s => document.querySelector(s);
const el = {
  proxy:$('#proxy'), apikey:$('#apikey'), src:$('#src'), dst:$('#dst'),
  engine:$('#engine'), mic:$('#mic'), clear:$('#clear'), swap:$('#swap'),
  log:$('#log'), status:$('#status'),
  tts:$('#tts'), duck:$('#duck'), prev:$('#prev')
};

['proxy','apikey','src','dst','engine'].forEach(k=>{
  const v = store.get('itp_'+k); if(v) el[k].value = v;
  el[k].addEventListener('change', ()=> store.set('itp_'+k, el[k].value));
});

/* =========================================================================
   1. 번역 클라이언트 — 캐시 + 타임아웃 + 순서보장(seq) + 재시도
   ========================================================================= */
class Translator {
  constructor(){ this.cache = new Map(); this.previewCtrl = null; }

  _key(e,s,t,x){ return `${e}|${s}|${t}|${x}`; }

  async translate(text, {engine, source, target, context='', signal=null}={}) {
    const k = this._key(engine, source, target, text);
    if (this.cache.has(k)) return this.cache.get(k);

    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), CFG.FETCH_TIMEOUT_MS);
    if (signal) signal.addEventListener('abort', ()=>ctrl.abort(), {once:true});

    const headers = {'Content-Type':'application/json'};
    const key = el.apikey.value.trim();
    if (key) headers['X-Api-Key'] = key;

    try {
      const r = await fetch(el.proxy.value.trim(), {
        method:'POST', headers, signal: ctrl.signal,
        body: JSON.stringify({engine, text, source, target, context})
      });
      const j = await r.json().catch(()=>({}));
      if (!r.ok || !j.text) throw new Error(j.error || `HTTP ${r.status}`);
      if (this.cache.size > CFG.CACHE_MAX) this.cache.clear();
      this.cache.set(k, j.text);
      return j.text;
    } finally { clearTimeout(timer); }
  }

  // 미리보기 전용 레인: 새 요청이 오면 이전 요청을 취소 → 경합/역순 도착 원천 차단
  async preview(text, opts) {
    if (this.previewCtrl) this.previewCtrl.abort();
    this.previewCtrl = new AbortController();
    return this.translate(text, {...opts, signal: this.previewCtrl.signal});
  }
}

/* =========================================================================
   2. 연속 음성인식 엔진
   ========================================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

class ContinuousSTT {
  constructor({onPartial, onSegment, onState}) {
    this.onPartial = onPartial;   // (committed, interim)
    this.onSegment = onSegment;   // (finalText)
    this.onState   = onState;     // (stateString, isError)

    this.running   = false;  // 사용자 의도
    this.muted     = false;  // TTS 재생 중 일시 차단
    this.alive     = false;  // 현재 세션 활성 여부
    this.restarting= false;
    this.rec       = null;
    this.lang      = 'en-US';

    this.pending      = '';  // 확정됐지만 아직 flush 안 된 원문
    this.interim      = '';
    this.lastFinalIdx = -1;  // ★ 세션마다 리셋 — 중복 방지 핵심
    this.lastEventAt  = 0;
    this.backoff      = 300;
    this.flushTimer   = null;

    this.watchdog = setInterval(()=>this._watch(), CFG.WATCHDOG_MS);
  }

  /* ---- 공개 API ---- */
  start(lang){
    if (!SR) { this.onState('이 브라우저는 음성인식을 지원하지 않습니다 (Chrome 사용)', true); return false; }
    this.lang = lang;
    this.running = true;
    this.backoff = 300;
    this._begin();
    return true;
  }

  stop(){
    this.running = false;
    clearTimeout(this.flushTimer);
    this._flush();                       // 남은 버퍼는 확정하고 종료
    if (this.rec) { try{ this.rec.onend = null; this.rec.abort(); }catch(e){} }
    this.rec = null; this.alive = false;
    this.onState('중지됨');
  }

  mute(v){
    this.muted = v;
    if (v && this.rec) { try{ this.rec.abort(); }catch(e){} }   // onend → 재시작은 muted로 차단됨
    else if (!v && this.running && !this.alive) this._begin();
  }

  /* ---- 내부 ---- */
  _begin(){
    if (!this.running || this.muted || this.alive) return;

    // 매 세션 새 인스턴스: Android에서 재사용 시 상태가 꼬이는 사례가 많음
    const rec = new SR();
    rec.lang = this.lang;
    rec.continuous = true;      // 데스크톱에선 유효, Android에선 무시될 수 있음
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    this.lastFinalIdx = -1;     // ★ 세션 인덱스 리셋
    this.lastEventAt = Date.now();

    rec.onstart = () => {
      this.alive = true; this.backoff = 300;
      this.onState('<span class="live">● 듣는 중</span>');
    };

    rec.onresult = (e) => this._onResult(e);

    rec.onerror = (e) => {
      const t = e.error;
      if (t === 'no-speech' || t === 'aborted') return;            // 정상 순환
      if (t === 'not-allowed' || t === 'service-not-allowed') {
        this.running = false;
        this.onState('마이크 권한이 거부되었습니다', true);
        return;
      }
      if (t === 'audio-capture') { this.onState('마이크를 찾을 수 없습니다', true); return; }
      if (t === 'network') {
        this.backoff = Math.min(this.backoff * 2, 4000);
        this.onState('네트워크 재연결 중…', true);
        return;
      }
      this.onState('인식 오류: ' + t, true);
    };

    // ★★ 여기서 절대 flush 하지 않는다 ★★
    rec.onend = () => {
      this.alive = false;
      if (this.running && !this.muted) this._restart();
    };

    this.rec = rec;
    try { rec.start(); }
    catch (err) {
      // InvalidStateError: 이미 시작된 상태 → 정리 후 재시도
      this.alive = false;
      this._restart();
    }
  }

  _restart(){
    if (this.restarting) return;
    this.restarting = true;
    setTimeout(()=>{
      this.restarting = false;
      if (this.running && !this.muted && !this.alive) this._begin();
    }, Math.max(CFG.RESTART_DELAY_MS, this.backoff > 300 ? this.backoff : CFG.RESTART_DELAY_MS));
  }

  _onResult(e){
    this.lastEventAt = Date.now();
    let addedFinal = '';
    let interim = '';

    // ★ resultIndex부터만 순회 (0부터 돌리면 중복 누적됨)
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const txt = res[0].transcript;
      if (res.isFinal) {
        if (i > this.lastFinalIdx) {          // 재전달된 final 방어
          addedFinal += txt;
          this.lastFinalIdx = i;
        }
      } else {
        interim += txt;
      }
    }

    if (addedFinal.trim()) {
      this.pending = (this.pending + ' ' + addedFinal.trim()).replace(/\s+/g,' ').trim();
    }
    this.interim = interim.trim();
    this.onPartial(this.pending, this.interim);

    // 확정 조건 판단
    if (this.pending) {
      if (/[.!?。？！…]["')\]]?$/.test(this.pending) || this.pending.length >= CFG.HARD_FLUSH_CHARS) {
        this._flush();
      } else {
        this._arm();
      }
    }
  }

  _arm(){
    clearTimeout(this.flushTimer);
    this.flushTimer = setTimeout(()=>this._flush(), CFG.SILENCE_FLUSH_MS);
  }

  _flush(){
    clearTimeout(this.flushTimer);
    const text = this.pending.trim();
    if (!text) return;
    this.pending = '';
    this.interim = '';
    this.onPartial('', '');
    this.onSegment(text);
  }

  _watch(){
    if (!this.running || this.muted) return;
    const now = Date.now();
    if (!this.alive && !this.restarting) { this._begin(); return; }        // 좀비 부활
    if (this.alive && now - this.lastEventAt > CFG.DEAD_AIR_MS) {          // 살아있다는데 무응답
      try { this.rec.abort(); } catch(e){}
      this.alive = false;
      this._restart();
    }
  }
}

/* =========================================================================
   3. UI 배선
   ========================================================================= */
const T = new Translator();
const BCP = { ko:'ko-KR', en:'en-US', cs:'cs-CZ' };

let previewCard = null, previewLastAt = 0, previewLastText = '';
let contextBuf = [];       // DeepL context용 최근 원문 (요금 미청구)
let segNo = 0;

function setStatus(html, isErr){
  el.status.innerHTML = isErr ? `<span class="err">${html}</span>` : html;
}

function getPreviewCard(){
  if (!previewCard) {
    previewCard = document.createElement('div');
    previewCard.className = 'card preview';
    previewCard.innerHTML = '<div class="src"></div><div class="dst pending"></div>';
    el.log.appendChild(previewCard);
  }
  return previewCard;
}
function killPreview(){ if (previewCard) previewCard.remove(); previewCard = null; }

function onPartial(committed, interim){
  if (!el.prev.checked) return;
  const live = (committed + ' ' + interim).trim();
  if (!live) { killPreview(); return; }

  const c = getPreviewCard();
  c.querySelector('.src').textContent = live;

  const now = Date.now();
  if (live.length < CFG.PREVIEW_MIN_CHARS) return;
  if (live === previewLastText) return;
  if (now - previewLastAt < CFG.PREVIEW_THROTTLE) return;
  previewLastAt = now; previewLastText = live;

  T.preview(live, {
    engine: el.engine.value, source: el.src.value, target: el.dst.value,
    context: contextBuf.join(' ').slice(-CFG.CONTEXT_CHARS)
  }).then(out=>{
    if (previewCard === c) c.querySelector('.dst').textContent = out;
  }).catch(()=>{ /* abort/타임아웃은 무시 — 곧 다음 요청이 옴 */ });
}

async function onSegment(text){
  killPreview();
  previewLastText = '';
  const id = ++segNo;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="src"></div>
                    <div class="dst pending">번역 중…</div>
                    <div class="meta"><span>#${id}</span><span></span></div>`;
  card.querySelector('.src').textContent = text;
  el.log.appendChild(card);
  card.scrollIntoView({block:'end', behavior:'smooth'});

  const ctx = contextBuf.join(' ').slice(-CFG.CONTEXT_CHARS);
  contextBuf.push(text);
  if (contextBuf.length > 3) contextBuf.shift();

  const t0 = performance.now();
  let out = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      out = await T.translate(text, {
        engine: el.engine.value, source: el.src.value,
        target: el.dst.value, context: ctx
      });
      break;
    } catch (err) {
      if (attempt === 1) {
        card.querySelector('.dst').className = 'dst fail';
        card.querySelector('.dst').textContent = '번역 실패: ' + err.message;
        return;
      }
      await new Promise(r=>setTimeout(r, 400));
    }
  }

  const d = card.querySelector('.dst');
  d.className = 'dst'; d.textContent = out;
  card.querySelectorAll('.meta span')[1].textContent = Math.round(performance.now()-t0) + 'ms';

  if (el.tts.checked) speak(out, el.dst.value);
}

/* ---- TTS: 재생 중 마이크 차단 → 피드백 루프 차단 ---- */
let ttsQueue = 0;
function speak(text, lang){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = BCP[lang] || lang;
  u.rate = 1.05;
  ttsQueue++;
  if (el.duck.checked && ttsQueue === 1) stt.mute(true);
  const done = () => {
    ttsQueue = Math.max(0, ttsQueue - 1);
    if (el.duck.checked && ttsQueue === 0) stt.mute(false);
  };
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}

const stt = new ContinuousSTT({ onPartial, onSegment, onState: setStatus });

el.mic.addEventListener('click', async ()=>{
  if (stt.running) {
    stt.stop();
    el.mic.classList.remove('on');
    el.mic.textContent = '● 통역 시작';
    return;
  }
  if (!el.proxy.value.trim()) { setStatus('설정에서 Worker URL을 먼저 입력하세요', true); return; }

  // 권한을 먼저 명시적으로 받으면 첫 세션 실패율이 크게 줄어듦
  try { (await navigator.mediaDevices.getUserMedia({audio:true})).getTracks().forEach(t=>t.stop()); }
  catch(e){ setStatus('마이크 권한이 필요합니다', true); return; }

  // 온디바이스 인식이 가능하면 사용 (지연·비프음·네트워크 의존 감소)
  try {
    if (SR.available) {
      const st = await SR.available({langs:[BCP[el.src.value]], processLocally:true});
      if (st === 'downloading') setStatus('온디바이스 언어팩 다운로드 중…');
      else if (st !== 'available' && SR.install) SR.install({langs:[BCP[el.src.value]], processLocally:true}).catch(()=>{});
    }
  } catch(e){}

  if (stt.start(BCP[el.src.value] || el.src.value)) {
    el.mic.classList.add('on');
    el.mic.textContent = '■ 통역 중지';
  }
});

el.clear.addEventListener('click', ()=>{ el.log.innerHTML=''; previewCard=null; contextBuf=[]; segNo=0; });

el.swap.addEventListener('click', ()=>{
  const a = el.src.value; el.src.value = el.dst.value; el.dst.value = a;
  store.set('itp_src', el.src.value); store.set('itp_dst', el.dst.value);
  if (stt.running) { stt.stop(); el.mic.click(); }
});

// 화면이 백그라운드로 가면 Android가 세션을 죽임 → 복귀 시 자동 복구
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden && stt.running && !stt.alive) stt._begin();
});
</script>
</body>
</html>
